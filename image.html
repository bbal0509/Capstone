<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        section {
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        img {
            display: block;
            margin-top: 10px;
        }

        a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h1>Image and Link Practice</h1>

    <section>
        <h2>#1 Insert an image</h2>
        <img src="squirrel-8211238_1280.jpg" alt="A squirrel standing on a log" width="500">
    </section>

    <section>
        <h2>#2 Resize it</h2>
        <img src="squirrel-8211238_1280.jpg" alt="A squirrel standing on a log" width="300" height="220">
    </section>

    <section>
        <h2>#3 Add a simple link</h2>
        <a href="https://www.google.com">Visit Google</a>
    </section>

    <section>
        <h2>#4 Turn an image into a link</h2>
        <a href="https://www.google.com">
            <img src="squirrel-8211238_1280.jpg" alt="A squirrel standing on a log" width="250">
        </a>
    </section>

    <section>
        <h2>#5 Add a link to another HTML page</h2>
        <a href="index.html">Go to the homepage</a>
    </section>
</body>
</html>
