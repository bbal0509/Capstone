<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Dentists Club</title>
</head>
<body>
    <h1>Future Dentists Club!</h1>
    <p>Interested in pursuing a career in dentistry? Join our club!</p>
    <form action="submit_form.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="grade">How often do you brush your teeth?:</label>
        <select id="grade" name="grade" required>
            <option value="">Select one</option>
            <option value="daily">Daily</option>
            <option value="few_times_week">A few times a week</option>
            <option value="rarely">Rarely</option>
            <option value="never">Never</option>
        </select><br><br>

        <label for="interest">Why are you interested in joining the Future Dentists Club?</label><br>
        <textarea id="interest" name="interest" rows="4" cols="50" required></textarea><br><br>

        <input type="submit" value="Join Now">
</body>
</html>
